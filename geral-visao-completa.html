<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Quantidade Vendida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DEE9F4; --card:#F4F7FB; --ink:#191C18; --ink2:#7C827A; --ink3:#A3A8A1;
  --line:#DEE7F1; --soft:#E7EEF7; --brand:#0E8F45; --brand-soft:#EFF9F1;
  --up:#0A7238; --up-soft:#DCF0E2; --down:#8E1713; --down-soft:#FBE3E1;
  --warn:#A06E00; --warn-soft:#FDF0D3;
  --bar:#0E8F45; --bar-mute:#CFDAE8; --shadow:0 1px 2px rgba(23,37,60,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101826; --card:#16202F; --ink:#EEF3F9; --ink2:#93A2B4; --ink3:#6E7F94;
    --line:#202C3E; --soft:#1C2839; --brand:#169B4F; --brand-soft:#123424;
    --up:#7FD9A2; --up-soft:#123524; --down:#F4A19C; --down-soft:#3A1614;
    --warn:#F2C25A; --warn-soft:#3A2A08;
    --bar:#22B25F; --bar-mute:#2A3850; --shadow:0 1px 2px rgba(3,7,14,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --card:#16202F; --ink:#EEF3F9; --ink2:#93A2B4; --ink3:#6E7F94;
  --line:#202C3E; --soft:#1C2839; --brand:#169B4F; --brand-soft:#123424;
  --up:#7FD9A2; --up-soft:#123524; --down:#F4A19C; --down-soft:#3A1614;
  --warn:#F2C25A; --warn-soft:#3A2A08;
  --bar:#22B25F; --bar-mute:#2A3850; --shadow:0 1px 2px rgba(3,7,14,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* topo */
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
header.top img{height:46px;width:auto;display:block}
.ttl h1{margin:0;font-size:20px;letter-spacing:.2px}
.ttl .sub{color:var(--ink2);font-size:13px}
.top .sp{flex:1}
.stamp{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}

/* filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.datenav{display:inline-flex;align-items:center;gap:4px}
.datenav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav .lbl{min-width:150px;text-align:center;font-weight:600}
input[type=date],select,input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.fl{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.fl.hide{display:none}

/* cartoes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:default;position:relative}
.kpi.un{cursor:pointer}
.kpi.un.sel{outline:2px solid var(--brand);outline-offset:-2px}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--ink2);text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:700;margin:2px 0 2px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:4px}
.kpi .d{font-size:12px;color:var(--ink2)}
.up{color:var(--up)} .down{color:var(--down)}
.kpis.money{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpis.money .kpi .v{font-size:22px}

/* grade principal */
.grid{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid > div{min-width:0}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{z-index:2}
tbody tr:hover td:first-child{background:var(--soft)}
.tfoot td:first-child{background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card h2{font-size:14px;margin:0;font-weight:700}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.card .hd .hint{color:var(--ink2);font-size:12px;font-weight:400}
.card .hd .sp{flex:1}
.card .bd{padding:0 14px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

/* tabela */
.tbl-wrap{overflow:auto;max-height:640px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--card);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);font-weight:700;cursor:pointer;user-select:none;z-index:1}
th:first-child,td:first-child{text-align:left}
th.sorted::after{content:" ▾";color:var(--brand)}
th.sorted.asc::after{content:" ▴"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tr.zero td{color:var(--ink3)}
td.prod{max-width:230px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
tr.zero td.prod{font-weight:400}
.unb{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.tfoot td{font-weight:700;background:var(--soft);position:sticky;bottom:0}
.divbar{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.divbar .tr{position:relative;width:70px;height:10px}
.divbar .tr::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--bar-mute)}
.divbar .f{position:absolute;top:1px;height:8px;border-radius:2px}
.divbar .f.p{left:50%;background:var(--up)}
.divbar .f.n{right:50%;background:var(--down)}
.divbar .t{min-width:44px;text-align:right}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.tag.alta{background:var(--up-soft);color:var(--up)}
.tag.queda{background:var(--down-soft);color:var(--down)}
.tag.est{background:var(--soft);color:var(--ink2)}
.tag.novo{background:var(--brand-soft);color:var(--brand)}

/* listas laterais */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list li:last-child{border-bottom:0}
.list li:hover .nm{color:var(--brand)}
.list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.list .sm{font-size:12px;color:var(--ink2)}
.list .rt{text-align:right}
.hbar{grid-column:1 / -1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.empty{color:var(--ink3);font-size:13px;padding:8px 0}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.pill.w{background:var(--down-soft);color:var(--down)}
.more{font-size:12px;color:var(--ink2);padding-top:6px}

/* grafico */
.chart{position:relative;padding:4px 14px 10px}
.chart svg{display:block;width:100%;height:190px}
.chart .bar{cursor:pointer}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 9px;border-radius:7px;font-size:12px;z-index:50;display:none;white-space:nowrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,12,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:40px 16px;overflow:auto}
.ov.on{display:flex}
.md{background:var(--card);border-radius:14px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md .mh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 6px}
.md .mh h3{margin:0;font-size:18px}
.md .mh .sub{color:var(--ink2);font-size:13px}
.md .mh .sp{flex:1}
.md .mb{padding:4px 18px 18px}
.md .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 12px}
.md .mini div{background:var(--soft);border-radius:10px;padding:8px 10px}
.md .mini b{display:block;font-size:18px}
.md .mini span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.md h4{margin:14px 0 4px;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.md table td,.md table th{position:static}
.foot{color:var(--ink3);font-size:12px;text-align:center;padding:10px 0 24px}
@media (max-width:640px){
  .wrap{padding:10px}
  .kpi .v{font-size:22px}
  .datenav .lbl{min-width:120px}
  .tbl-wrap{max-height:none}
  .kpis.money{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.money .kpi .v{font-size:18px}
  td.prod{max-width:150px}
}
@media print{
  .filters .iconbtn,.iconbtn{display:none}
  body{background:#fff}
  .card,.kpi{box-shadow:none}
  .tbl-wrap{max-height:none;overflow:visible}
}
</style>
</head>

<script>
/* Cofre do painel: abre dados.js criptografado (senha so na memoria da aba). Uso: cofreAbrir(function(dados){...}) */
(function(){
  var PW=null;
  function u(t){return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
  async function decifrar(env,senha){
    var te=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',te.encode(senha),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(env.salt),iterations:env.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(env.iv),additionalData:te.encode('takaara-painel-v1')},key,u(env.ct));
    var txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  window.cofreRecarregar=function(env){return PW?decifrar(env,PW):Promise.reject(new Error('sem senha'))};
  window.cofreAbrir=function(ok,variavel){
    var env=window[variavel||'DADOS_ENC'];
    if(!env){
      if(window.DADOS){ok(window.DADOS);return}
      var m=document.createElement('div');m.id='cofre';
      m.setAttribute('style','position:fixed;inset:0;z-index:99999;background:#DEE9F4;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif');

<script>
cofreAbrir(function(D){
"use strict";
const $ = s => document.querySelector(s);
const UN_ORD = ["CX","SC","BD","KG","UN","PT","PC","MC"];
const UN_NOME = {CX:"Caixas",SC:"Sacos",BD:"Bandejas",KG:"Quilos",UN:"Unidades",PT:"Pacotes",PC:"Peças",MC:"Maços"};
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DSEM = ["dom","seg","ter","qua","qui","sex","sáb"];

/* ---------- formatos ---------- */
const nf0 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fQ = v => nf2.format(v || 0);
const fR = v => "R$ " + nf2.format(v || 0);
const fRk = v => Math.abs(v) >= 1e6 ? "R$ " + nf2.format(v/1e6) + " mi" : Math.abs(v) >= 1e4 ? "R$ " + nf1.format(v/1e3) + " mil" : fR(v);
const fP = v => Math.abs(v) > 9.99 ? (v>0?"+999%+":"-999%") : (v>0?"+":"") + nf0.format(v*100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- datas (ISO yyyy-mm-dd, sem fuso) ---------- */
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const toS = d => d.toISOString().slice(0,10);
const addD = (s,n) => { const d = toD(s); d.setUTCDate(d.getUTCDate()+n); return toS(d); };
const diff = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const fD = s => s.slice(8,10)+"/"+s.slice(5,7);
const fDL = s => { const d = toD(s); return DSEM[d.getUTCDay()] + ", " + fD(s) + "/" + s.slice(0,4); };
const firstOfMonth = s => s.slice(0,8)+"01";
const edate = (s,n) => { const d = toD(s); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return toS(d); };

/* ---------- dimensoes ---------- */
const PROD = new Map(D.produtos.map(p => [p.p, p]));
const CLI = new Map(D.clientes.map(c => [c.c, c]));
const VNOME = new Map(D.vendedores.map(v => [v.v, v.n]));
const pessoa = n => String(n||"SEM VENDEDOR").replace(/\s+VENDAS\s+NA(\s+PEDRA)?\s*$/i,"").trim();
const GRUPOS = new Map();       // pessoa -> [codigos]
D.vendedores.forEach(v => { const k = pessoa(v.n); if(!GRUPOS.has(k)) GRUPOS.set(k, []); GRUPOS.get(k).push(v.v); });
const grupoDe = v => pessoa(VNOME.get(v));

const ITENS = D.itens.filter(r => { const p = PROD.get(r.p); return !p || p.t !== "SERVICO"; });
const HOJE = (D.geradoEm || "").slice(0,10) || toS(new Date());

/* ---------- estado ---------- */
const st = { modo:"dia", data:null, de:null, ate:null, vend:"*", un:null, busca:"", sort:{c:"f",dir:-1} };
try { const t = localStorage.getItem("qtd_tema"); if (t) document.documentElement.dataset.theme = t; } catch(e){}

/* ---------- filtro de vendedor ---------- */
function vendSet(){
  if (st.vend === "*") return null;
  return new Set(GRUPOS.get(st.vend) || []);
}
const _ivCache = new Map();
function itensVend(){ if (!_ivCache.has(st.vend)){ const s = vendSet(); _ivCache.set(st.vend, s ? ITENS.filter(r => s.has(r.v)) : ITENS); } return _ivCache.get(st.vend); }
function datasComVenda(rows){ return [...new Set(rows.map(r => r.d))].sort(); }
/* dias "fortes": faturamento de pelo menos 40% de um dia normal (tira sabado/feriado com 2 ou 3 itens),
   usados para o comparativo do dia e para a media 7d */
const _fortesCache = new WeakMap();
function diasFortes(rows){
  if (_fortesCache.has(rows)) return _fortesCache.get(rows);
  const c = new Map(); rows.forEach(r => c.set(r.d, (c.get(r.d)||0) + r.f));
  const v = [...c.values()].sort((a,b)=>a-b); const med = v.length ? v[Math.floor(v.length/2)] : 0;
  const out = [...c.entries()].filter(([d,n]) => n >= med*0.4).map(([d]) => d).sort();
  _fortesCache.set(rows, out); return out;
}

/* ---------- periodo e comparativo (mesma regra do Power BI) ---------- */
function periodo(rows, datas){
  const ultima = datas[datas.length-1] || HOJE;
  let ini, fim, cIni, cFim, rot;
  const fortes = diasFortes(rows);
  const antesDe = d => { for (let i = fortes.length-1; i >= 0; i--) if (fortes[i] < d) return fortes[i]; return null; };
  if (st.modo === "dia" || st.modo === "ant"){
    ini = fim = st.data;
    const c = antesDe(ini); cIni = cFim = c; rot = c ? "vs " + fD(c) : "sem período anterior";
  } else if (st.modo === "7d"){
    fim = st.data; ini = addD(fim,-6); cIni = addD(ini,-7); cFim = addD(fim,-7); rot = "vs 7 dias anteriores";
  } else if (st.modo === "mes"){
    fim = st.data; ini = firstOfMonth(fim);
    const u = datas.filter(d => d >= ini && d <= fim).pop() || fim;
    cIni = firstOfMonth(edate(ini,-1)); cFim = edate(u,-1);
    rot = "vs mesmo período de " + MESES[toD(cIni).getUTCMonth()];
  } else {
    ini = st.de; fim = st.ate; if (ini > fim) [ini,fim] = [fim,ini];
    const n = diff(ini,fim)+1; cFim = addD(ini,-1); cIni = addD(cFim,-(n-1)); rot = "vs " + n + " dias anteriores";
  }
  const ant7 = fortes.filter(d => d < ini).slice(-7);   // ultimos 7 dias com venda antes do periodo
  return {ini, fim, cIni, cFim, rot, ultima, ant7};
}

function agrega(rows, ini, fim){
  const A = {prod:new Map(), un:new Map(), cli:new Map(), vend:new Map(), f:0, n:0};
  if (!ini) return A;
  for (const r of rows){
    if (r.d < ini || r.d > fim) continue;
    const p = PROD.get(r.p) || {n:"PRODUTO "+r.p, un:"?"};
    A.f += r.f; A.n++;
    let x = A.prod.get(r.p); if(!x){ x={q:0,f:0,b:0}; A.prod.set(r.p,x);} x.q+=r.q; x.f+=r.f; x.b+=(r.b||0);
    A.un.set(p.un, (A.un.get(p.un)||0) + r.q);
    let c = A.cli.get(r.c); if(!c){ c={q:new Map(),f:0,itens:0}; A.cli.set(r.c,c);} c.f+=r.f; c.itens++; c.q.set(p.un,(c.q.get(p.un)||0)+r.q);
    const g = grupoDe(r.v); let v = A.vend.get(g); if(!v){ v={un:new Map(),f:0,cli:new Set()}; A.vend.set(g,v);} v.f+=r.f; v.cli.add(r.c); v.un.set(p.un,(v.un.get(p.un)||0)+r.q);
  }
  return A;
}
function agregaDias(rows, dias){
  const A = {prod:new Map()};
  for (const r of rows){ if (!dias.has(r.d)) continue; let x = A.prod.get(r.p); if(!x){ x={q:0,f:0}; A.prod.set(r.p,x);} x.q+=r.q; x.f+=r.f; }
  return A;
}
function pedidos(ini, fim){
  if (!ini) return 0; const s = vendSet(); let n = 0;
  for (const r of D.pedidos) if (r.d >= ini && r.d <= fim && (!s || s.has(r.v))) n += r.n;
  return n;
}
function pesoPorCliente(ini, fim){
  const m = new Map(); if (!ini) return m; const s = vendSet();
  for (const r of D.pedidos) if (r.d >= ini && r.d <= fim && (!s || s.has(r.v)) && r.pe) m.set(r.c, (m.get(r.c)||0) + r.pe);
  return m;
}

/* ---------- render ---------- */
function render(){
  const rows = itensVend();
  const datas = datasComVenda(rows);
  if (!st.data || (st.modo!=="per" && !datas.includes(st.data) && st.modo!=="7d" && st.modo!=="mes")) {
    st.data = datas.filter(d => d <= HOJE).pop() || datas[datas.length-1] || HOJE;
    if (st.modo === "ant"){ st.data = diasFortes(rows).filter(d => d < st.data).pop() || st.data; }
  }
  const P = periodo(rows, datas);
  const A = agrega(rows, P.ini, P.fim);
  const B = agrega(rows, P.cIni, P.cFim);
  const isDia = st.modo === "dia" || st.modo === "ant";
  // media 7d = media dos 7 ultimos dias com venda (no Power BI dividia por 7 dias corridos, contando domingo)
  const M = isDia && P.ant7.length ? agregaDias(rows, new Set(P.ant7)) : (isDia ? agrega(rows,null,null) : null);
  if (M) M.nd = P.ant7.length || 1;
  const fortesP = diasFortes(rows).filter(d => d >= P.ini && d <= P.fim).length;
  const nDias = Math.max(1, fortesP || (diff(P.ini,P.fim)+1));   // media/dia = por dia com venda

  // unidade padrao
  const unsDisp = UN_ORD.filter(u => (A.un.get(u)||0) > 0 || (B.un.get(u)||0) > 0);
  if (!st.un || !UN_ORD.includes(st.un)) st.un = unsDisp[0] || "CX";

  // cabecalho / filtros
  document.querySelectorAll("#segModo button").forEach(b => b.classList.toggle("on", b.dataset.m === st.modo));
  $("#dateNav").style.display = st.modo === "per" ? "none" : "";
  $("#flPer").classList.toggle("hide", st.modo !== "per");
  $("#lblData").textContent = isDia ? fDL(P.ini) : fD(P.ini) + " a " + fD(P.fim);
  const iD = datas.indexOf(st.data);
  $("#prevDia").disabled = iD <= 0 && datas.length > 0 && st.data <= datas[0];
  $("#nextDia").disabled = st.data >= datas[datas.length-1];
  $("#subtitulo").textContent = (D.escopo ? D.escopo : (st.vend === "*" ? "Todos os vendedores" : st.vend)) + " · " + (D.empresa || "") ;

  renderKpis(A, B, P);
  renderChart(rows, P, datas);
  renderTabela(A, B, M, P, isDia, nDias);
  renderLaterais(A, B, M, P, isDia, rows);
  $("#rodape").textContent = "Considera só operações de venda (" + (D.operacoes||[]).join(", ") + "). Pedidos cancelados ficam de fora. Dados de " + fD(D.dataIni||datas[0]||HOJE) + " em diante.";
}

function delta(cur, ant, unidade, rot){
  if (!ant) return '<span class="d">sem base de comparação</span>';
  const d = cur - ant, cls = d >= 0 ? "up" : "down", ar = d >= 0 ? "▲" : "▼";
  return '<span class="d"><b class="'+cls+'">'+ar+' '+unidade(Math.abs(d))+' ('+fP(d/ant)+')</b> '+esc(rot)+'</span>';
}
function renderKpis(A, B, P){
  const vol = UN_ORD.filter(u => (A.un.get(u)||0) > 0 || (B.un.get(u)||0) > 0);
  $("#kpisVol").innerHTML = vol.map(u => {
    const c = A.un.get(u)||0, b = B.un.get(u)||0;
    return '<div class="kpi un'+(u===st.un?' sel':'')+'" data-un="'+u+'" title="Clique para ver o gráfico e a tabela em '+UN_NOME[u]+'">'+
      '<div class="k">'+UN_NOME[u]+' ('+u+')</div><div class="v num">'+fQ(c)+'</div>'+delta(c,b,v=>fQ(v)+" "+u,P.rot)+'</div>';
  }).join("") || '<div class="kpi"><div class="k">Volume</div><div class="v">0</div><div class="d">sem vendas no período</div></div>';
  const pA = pedidos(P.ini,P.fim), pB = pedidos(P.cIni,P.cFim);
  const tA = pA ? A.f/pA : 0, tB = pB ? B.f/pB : 0;
  const card = (k,v,d) => '<div class="kpi"><div class="k">'+k+'</div><div class="v num">'+v+'</div>'+d+'</div>';
  $("#kpisVal").innerHTML =
    card("Faturamento", fR(A.f), delta(A.f,B.f,fRk,P.rot)) +
    card("Pedidos", nf0.format(pA), '<span class="d">'+nf0.format(A.cli.size)+' clientes atendidos</span>') +
    card("Ticket médio", fR(tA), delta(tA,tB,fR,P.rot)) +
    card("Produtos distintos", nf0.format(A.prod.size), delta(A.prod.size,B.prod.size,v=>nf0.format(v),P.rot));
}

/* grafico de barras diario da unidade escolhida */
function renderChart(rows, P, datas){
  const fim = P.fim, ini0 = addD(fim, -34), u = st.un;
  const dias = []; for (let d = ini0; d <= fim; d = addD(d,1)) dias.push(d);
  const por = new Map(dias.map(d => [d,0]));
  for (const r of rows){ if (r.d < ini0 || r.d > fim) continue; const p = PROD.get(r.p); if (p && p.un === u) por.set(r.d, por.get(r.d)+r.q); }
  const vals = dias.map(d => por.get(d));
  const max = Math.max(1, ...vals);
  $("#tChart").textContent = "Evolução diária · " + UN_NOME[u];
  $("#hChart").textContent = "últimos 35 dias · clique numa barra para abrir o dia";
  const W = 900, H = 190, L = 44, R = 6, T = 10, Bm = 24, iw = W-L-R, ih = H-T-Bm, bw = iw/dias.length;
  const nice = n => { const p = Math.pow(10, Math.floor(Math.log10(n))); const m = n/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; };
  const step = nice(max/4), top = Math.ceil(max/step)*step;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Quantidade por dia">';
  for (let g = 0; g <= top; g += step){
    const y = T + ih - ih*g/top;
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>' +
         '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--ink3)">'+nf0.format(g)+'</text>';
  }
  dias.forEach((d,i) => {
    const v = vals[i], h = Math.max(v>0?2:0, ih*v/top), x = L + i*bw + 1.5, y = T + ih - h, w = Math.max(2,bw-3);
    const on = d >= P.ini && d <= P.fim;
    s += '<rect class="bar" data-d="'+d+'" data-v="'+v+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="'+(on?'var(--bar)':'var(--bar-mute)')+'"/>' +
         '<rect class="bar" data-d="'+d+'" data-v="'+v+'" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>';
    const wd = toD(d).getUTCDay();
    if (i % 5 === 0 || i === dias.length-1) s += '<text x="'+(L+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--ink3)">'+fD(d)+'</text>';
    else if (wd === 0) s += '<text x="'+(L+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">·</text>';
  });
  s += '</svg>';
  $("#chart").innerHTML = s;
  $("#chart").querySelectorAll(".bar").forEach(el => {
    el.addEventListener("mousemove", e => tip(e, "<b>"+fDL(el.dataset.d)+"</b><br>"+fQ(+el.dataset.v)+" "+u));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", () => { if(!datas.includes(el.dataset.d)) return; st.modo="dia"; st.data = el.dataset.d; hideTip(); render(); });
  });
}

let linhasTab = [];
function renderTabela(A, B, M, P, isDia, nDias){
  // chips de unidade
  const presentes = UN_ORD.filter(u => [...A.prod.keys(), ...B.prod.keys(), ...(M?M.prod.keys():[])].some(p => (PROD.get(p)||{}).un === u));
  $("#chipsUn").innerHTML = ['<button class="chip'+(st.unTab?'':' on')+'" data-u="">Todas</button>'].concat(
    presentes.map(u => '<button class="chip'+(st.unTab===u?' on':'')+'" data-u="'+u+'">'+u+'</button>')).join("");
  $("#chipsUn").querySelectorAll(".chip").forEach(b => b.onclick = () => { st.unTab = b.dataset.u || null; render(); });

  const ids = new Set([...A.prod.keys(), ...B.prod.keys(), ...(M?M.prod.keys():[])]);
  const busca = st.busca.trim().toUpperCase();
  linhasTab = [];
  for (const id of ids){
    const p = PROD.get(id) || {n:"PRODUTO "+id, un:"?"};
    if (st.unTab && p.un !== st.unTab) continue;
    if (busca && !p.n.toUpperCase().includes(busca)) continue;
    const a = A.prod.get(id) || {q:0,f:0,b:0}, b = B.prod.get(id) || {q:0,f:0};
    const r = {id, n:p.n, un:p.un, q:a.q, f:a.f, ant:b.q, pm: a.q ? a.b/a.q : 0};   // preco medio BRUTO (antes do desconto)
    if (isDia){
      const m = M.prod.get(id); r.med = m ? m.q/M.nd : 0;
      r.var = r.med ? (r.q - r.med)/r.med : null;
      r.sug = (r.q || r.med) ? Math.ceil(Math.max(r.q, r.med)*1.03) : 0;
      r.tend = !r.q ? "" : !r.med ? "novo" : r.var >= .3 ? "alta" : r.var <= -.3 ? "queda" : "est";
    } else {
      r.med = r.q / nDias;
      r.var = r.ant ? (r.q - r.ant)/r.ant : null;
      r.tend = !r.q ? "" : !r.ant ? "novo" : r.var >= .3 ? "alta" : r.var <= -.3 ? "queda" : "est";
    }
    linhasTab.push(r);
  }
  const cols = isDia ? [
      {c:"n",t:"Produto"},{c:"un",t:"UN"},{c:"q",t:"Qtd"},{c:"ant",t:"Dia ant."},
      {c:"var",t:"Var. vs média"},{c:"sug",t:"Sugerida"},{c:"pm",t:"Preço médio bruto"},{c:"f",t:"Faturamento"}]
    : [
      {c:"n",t:"Produto"},{c:"un",t:"UN"},{c:"q",t:"Qtd"},{c:"ant",t:"Período ant."},{c:"var",t:"Var. vs anterior"},
      {c:"med",t:"Média/dia"},{c:"pm",t:"Preço médio bruto"},{c:"f",t:"Faturamento"}];
  if (!cols.some(c => c.c === st.sort.c)) st.sort = {c:"f",dir:-1};
  const k = st.sort.c, dir = st.sort.dir;
  const ordT = {alta:4,novo:3,est:2,queda:1,"":0};
  linhasTab.sort((x,y) => {
    let a = x[k], b = y[k];
    if (k === "tend"){ a = ordT[a]; b = ordT[b]; }
    if (typeof a === "string") return dir * a.localeCompare(b,"pt-BR");
    a = a ?? -Infinity; b = b ?? -Infinity;
    return dir * (a - b) || (y.f - x.f);
  });
  $("#hTab").textContent = isDia ? "Sugerida = maior entre hoje e média 7d, +3%" : P.rot;
  $("#tab thead").innerHTML = "<tr>" + cols.map(c => '<th data-c="'+c.c+'" class="'+(c.c===k?'sorted'+(dir>0?' asc':''):'')+'">'+c.t+'</th>').join("") + "</tr>";
  const tagTxt = {alta:"▲ alta",queda:"▼ queda",est:"estável",novo:"novo"};
  const cell = (r,c) => {
    switch(c){
      case "n": return '<td class="prod" title="'+esc(r.n)+'">'+esc(r.n)+'</td>';
      case "un": return '<td><span class="unb">'+esc(r.un)+'</span></td>';
      case "q": case "ant": case "med": return '<td class="num">'+(r[c] ? fQ(r[c]) : "–")+'</td>';
      case "sug": return '<td class="num"><b>'+(r.sug ? nf0.format(r.sug) : "–")+'</b></td>';
      case "var": {
        if (r.var === null) return '<td class="num">–</td>';
        const w = Math.min(1, Math.abs(r.var)) * 35;
        return '<td><span class="divbar"><span class="tr"><span class="f '+(r.var>=0?'p':'n')+'" style="width:'+w+'px"></span></span><span class="t num '+(r.var>=0?'up':'down')+'">'+fP(r.var)+'</span></span></td>';
      }
      case "tend": return '<td>'+(r.tend ? '<span class="tag '+r.tend+'">'+tagTxt[r.tend]+'</span>' : "")+'</td>';
      case "pm": return '<td class="num">'+(r.pm ? fR(r.pm) : "–")+'</td>';
      case "f": return '<td class="num">'+(r.f ? fR(r.f) : "–")+'</td>';
    }
  };
  const semVenda = linhasTab.filter(r => !r.q).length;
  const mostrar = st.zeros ? linhasTab : linhasTab.filter(r => r.q);
  $("#tab tbody").innerHTML = mostrar.map(r => '<tr data-p="'+r.id+'" class="'+(r.q?'':'zero')+'">'+cols.map(c => cell(r,c.c)).join("")+'</tr>').join("")
    + (semVenda ? '<tr class="zero" id="trZeros"><td colspan="'+cols.length+'" style="text-align:left;cursor:pointer;color:var(--brand)">'+(st.zeros ? '▴ Esconder ' : '▾ Mostrar ')+semVenda+' produtos que vendiam e não venderam '+(isDia?'neste dia':'no período')+'</td></tr>' : '')
    || '<tr><td colspan="'+cols.length+'" class="empty">Nenhum produto.</td></tr>';
  const tz = $("#trZeros"); if (tz) tz.onclick = () => { st.zeros = !st.zeros; render(); };
  // total (so soma qtd quando ha uma unidade so)
  const umaUn = new Set(linhasTab.map(r => r.un)).size === 1;
  const tq = linhasTab.reduce((s,r)=>s+r.q,0), tf = linhasTab.reduce((s,r)=>s+r.f,0), ta = linhasTab.reduce((s,r)=>s+r.ant,0);
  $("#tab tfoot").innerHTML = '<tr>'+cols.map(c => {
    if (c.c==="n") return '<td>Total ('+linhasTab.filter(r=>r.q).length+' produtos)</td>';
    if (c.c==="q") return '<td class="num">'+(umaUn?fQ(tq):"")+'</td>';
    if (c.c==="ant") return '<td class="num">'+(umaUn?fQ(ta):"")+'</td>';
    if (c.c==="f") return '<td class="num">'+fR(tf)+'</td>';
    return '<td></td>'; }).join("")+'</tr>';
  $("#tab thead").querySelectorAll("th").forEach(th => th.onclick = () => {
    const c = th.dataset.c; st.sort = st.sort.c === c ? {c, dir:-st.sort.dir} : {c, dir: (c==="n"||c==="un") ? 1 : -1}; render(); });
  $("#tab tbody").querySelectorAll("tr[data-p]").forEach(tr => tr.onclick = () => abrirProduto(+tr.dataset.p));
}

function renderLaterais(A, B, M, P, isDia, rows){
  // ranking (so na visao geral)
  const geral = !D.escopo && st.vend === "*";
  $("#cardRank").style.display = geral ? "" : "none";
  if (geral){
    const u = st.un;
    const L = [...A.vend.entries()].map(([g,v]) => ({g, q:v.un.get(u)||0, f:v.f, c:v.cli.size})).filter(x => (x.q > 0 || x.f > 0) && x.g.trim().toUpperCase() !== "VENDA SEM FINANCEIRO").sort((a,b)=>b.q-a.q || b.f-a.f);
    const mx = Math.max(1, ...L.map(x=>x.q));
    $("#hRank").textContent = "por " + UN_NOME[u].toLowerCase() + " · clique para filtrar";
    $("#lRank").innerHTML = L.map((x,i) => '<li data-g="'+esc(x.g)+'"><span class="nm">'+(i+1)+'. '+esc(x.g)+'</span><span class="rt num"><b>'+fQ(x.q)+' '+u+'</b></span>'+
      '<span class="hbar"><i style="width:'+(100*x.q/mx)+'%"></i></span><span class="sm">'+fR(x.f)+' · '+x.c+' clientes</span><span></span></li>').join("") || '<li class="empty">Sem vendas.</li>';
    $("#lRank").querySelectorAll("li[data-g]").forEach(li => li.onclick = () => { st.vend = li.dataset.g; $("#selVend").value = st.vend; render(); });
  }
  // acelerando / desacelerando (base >= 5) — mostra o máximo possível e depois ajusta a quantidade para alinhar com a coluna da esquerda
  const base = r => isDia ? r.med : r.ant;
  const rel = linhasTab.filter(r => base(r) >= 5 && r.q > 0 && r.var !== null);
  const altaAll = rel.filter(r => r.var > 0).sort((a,b)=>b.var-a.var);
  const quedaAll = linhasTab.filter(r => base(r) >= 5 && r.q > 0 && r.var !== null && r.var < 0).sort((a,b)=>a.var-b.var);
  const item = (r) => '<li data-p="'+r.id+'"><span class="nm">'+esc(r.n)+'</span><span class="rt num '+(r.var>=0?'up':'down')+'"><b>'+fP(r.var)+'</b></span>'+
     '<span class="sm">'+fQ(r.q)+' '+r.un+' · '+(isDia?'média ':'antes ')+fQ(base(r))+'</span><span></span></li>';
  function desenhaAltaQueda(n){
    const alta = altaAll.slice(0,n), queda = quedaAll.slice(0,n);
    $("#lAlta").innerHTML = alta.map(item).join("") || '<li class="empty">Nada acelerando acima de 0%.</li>';
    $("#lQueda").innerHTML = queda.map(item).join("") || '<li class="empty">Nada desacelerando.</li>';
    document.querySelectorAll("#lAlta li[data-p],#lQueda li[data-p]").forEach(li => li.onclick = () => abrirProduto(+li.dataset.p));
  }
  window.__desenhaAltaQueda = desenhaAltaQueda;
  window.__altaQuedaMax = Math.min(altaAll.length, quedaAll.length);
  desenhaAltaQueda(window.__altaQuedaMax);
  // clientes do periodo
  const C = [...A.cli.entries()].map(([c,v]) => ({c, f:v.f, q:v.q, it:v.itens})).sort((a,b)=>b.f-a.f);
  const mx = Math.max(1, ...C.map(x=>x.f));
  const pesoCli = pesoPorCliente(P.ini, P.fim);
  $("#hCli").textContent = C.length + " clientes";
  const top = C.slice(0,10);
  $("#lCli").innerHTML = top.map(x => { const cl = CLI.get(x.c)||{n:"Cliente "+x.c,cid:""};
    const qs = UN_ORD.filter(u => x.q.get(u)).slice(0,3).map(u => fQ(x.q.get(u))+" "+u).join(" · ");
    const pw = pesoCli.get(x.c);
    const peso = pw ? fQ(pw) + " kg" : "";
    const sub = [peso, qs].filter(Boolean).join(" · ");
    return '<li data-c="'+x.c+'"><span class="nm">'+esc(cl.n)+'</span><span class="rt num"><b>'+fR(x.f)+'</b></span><span class="hbar"><i style="width:'+(100*x.f/mx)+'%"></i></span><span class="sm">'+esc(sub)+'</span><span></span></li>'; }).join("")
    + (C.length > 10 ? '<li class="more" style="cursor:default">+ '+(C.length-10)+' clientes</li>' : "") || '<li class="empty">Sem clientes no período.</li>';
  $("#lCli").querySelectorAll("li[data-c]").forEach(li => li.onclick = () => abrirCliente(+li.dataset.c));
  // clientes sem comprar (ultima compra em toda a historia, por vendedor)
  const s = vendSet(), ult = new Map();
  for (const u of D.ult){ if (s && !s.has(u.v)) continue; if (!ult.has(u.c) || ult.get(u.c) < u.d) ult.set(u.c, u.d); }
  const ref = HOJE;
  const sem = [...ult.entries()].map(([c,d]) => ({c, d, dias: diff(d, ref)})).filter(x => x.dias >= 8).sort((a,b)=>a.dias-b.dias);
  const vis = sem.filter(x => x.dias <= 45);
  $("#lSem").innerHTML = vis.slice(0,12).map(x => { const cl = CLI.get(x.c)||{n:"Cliente "+x.c,cid:""};
    return '<li data-c="'+x.c+'"><span class="nm">'+esc(cl.n)+'</span><span class="rt"><span class="pill w">'+x.dias+' dias</span></span><span class="sm">'+esc(cl.cid||"")+' · última compra '+fD(x.d)+'</span><span></span></li>'; }).join("")
    + (vis.length > 12 ? '<li class="more" style="cursor:default">+ '+(vis.length-12)+' clientes entre 8 e 45 dias</li>' : "")
    + (sem.length > vis.length ? '<li class="more" style="cursor:default">'+(sem.length-vis.length)+' clientes há mais de 45 dias</li>' : "")
    || '<li class="empty">Todos os clientes compraram nos últimos 7 dias.</li>';
  $("#lSem").querySelectorAll("li[data-c]").forEach(li => li.onclick = () => abrirCliente(+li.dataset.c));
  alinharColunas();
}

/* ajusta quantos itens aparecem em Acelerando/Desacelerando para a coluna da direita terminar
   no mesmo nível da coluna da esquerda (Tabela + Clientes do período + Clientes sem comprar) */
function alinharColunas(){
  const grid = document.querySelector(".grid");
  if (!grid || grid.children.length < 2) return;
  const esq = grid.children[0], dir = grid.children[1];
  // só faz sentido alinhar quando as duas colunas estão lado a lado (layout de 2 colunas)
  if (dir.getBoundingClientRect().top >= esq.getBoundingClientRect().bottom - 2) return;
  const maxN = window.__altaQuedaMax || 0;
  if (maxN <= 0) return;
  const hEsq = esq.getBoundingClientRect().height;
  let melhorN = maxN, melhorDif = Infinity;
  for (let n = maxN; n >= 3; n--){
    window.__desenhaAltaQueda(n);
    const hD = dir.getBoundingClientRect().height, dif = Math.abs(hD - hEsq);
    if (dif < melhorDif){ melhorDif = dif; melhorN = n; }
    if (hD < hEsq) break; // já passou do ponto mais próximo, não precisa continuar
  }
  window.__desenhaAltaQueda(melhorN);
}

/* ---------- detalhes ---------- */
function janela(){ const rows = itensVend(); const P = periodo(rows, datasComVenda(rows)); return {rows, P}; }
function sparkHtml(rows, fim, val, unidade){
  const ini = addD(fim,-20), m = new Map(); for (let d = ini; d <= fim; d = addD(d,1)) m.set(d,0);
  rows.forEach(r => { if (m.has(r.d)) m.set(r.d, m.get(r.d) + val(r)); });
  const v = [...m.values()], mx = Math.max(1,...v), W = 700, H = 70, bw = W/v.length;
  return '<svg viewBox="0 0 '+W+' '+(H+16)+'" style="width:100%;height:86px">' + [...m.keys()].map((d,i) => {
    const h = Math.max(v[i]>0?2:0,(H-4)*v[i]/mx);
    return '<rect x="'+(i*bw+1)+'" y="'+(H-h)+'" width="'+(bw-2)+'" height="'+h+'" rx="2" fill="var(--bar)"><title>'+fD(d)+': '+unidade(v[i])+'</title></rect>' +
      (i%5===0||i===v.length-1 ? '<text x="'+(i*bw+bw/2)+'" y="'+(H+13)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">'+fD(d)+'</text>' : '');
  }).join("") + '</svg>';
}
function tabelaSimples(cab, linhas){
  return '<div style="max-height:300px;overflow:auto"><table><thead><tr>'+cab.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>'+linhas.join("")+'</tbody></table></div>';
}
function abrirProduto(id){
  const {rows, P} = janela(); const p = PROD.get(id) || {n:"Produto "+id, un:""};
  const R = rows.filter(r => r.p === id), noP = R.filter(r => r.d >= P.ini && r.d <= P.fim);
  const q = noP.reduce((s,r)=>s+r.q,0), f = noP.reduce((s,r)=>s+r.f,0), br = noP.reduce((s,r)=>s+(r.b||0),0);
  const porCli = new Map(), porV = new Map();
  noP.forEach(r => { const a = porCli.get(r.c)||{q:0,f:0,b:0}; a.q+=r.q; a.f+=r.f; a.b+=(r.b||0); porCli.set(r.c,a); const g = grupoDe(r.v); const b = porV.get(g)||{q:0,f:0}; b.q+=r.q; b.f+=r.f; porV.set(g,b); });
  let h = '<div class="mh"><div><h3>'+esc(p.n)+'</h3><div class="sub">'+esc(p.un)+' · '+fD(P.ini)+(P.ini!==P.fim?' a '+fD(P.fim):'')+'</div></div><div class="sp"></div><button class="iconbtn" data-x>✕</button></div><div class="mb">';
  h += '<div class="mini"><div><span>Quantidade</span><b class="num">'+fQ(q)+' '+esc(p.un)+'</b></div><div><span>Faturamento</span><b class="num">'+fR(f)+'</b></div><div><span>Preço médio bruto</span><b class="num">'+(q?fR(br/q):"–")+'</b></div><div><span>Clientes</span><b class="num">'+porCli.size+'</b></div></div>';
  h += '<h4>Últimos 21 dias</h4>' + sparkHtml(R, P.fim, r => r.q, v => fQ(v)+" "+p.un);
  if (!D.escopo && st.vend === "*" && porV.size > 1) h += '<h4>Por vendedor</h4>' + tabelaSimples(["Vendedor","Qtd","Faturamento"], [...porV.entries()].sort((a,b)=>b[1].q-a[1].q).map(([g,v]) => '<tr><td>'+esc(g)+'</td><td class="num">'+fQ(v.q)+'</td><td class="num">'+fR(v.f)+'</td></tr>'));
  h += '<h4>Quem comprou no período</h4>' + (porCli.size ? tabelaSimples(["Cliente","Qtd","Faturamento","Preço médio bruto"], [...porCli.entries()].sort((a,b)=>b[1].q-a[1].q).map(([c,v]) => { const cl = CLI.get(c)||{n:"Cliente "+c}; return '<tr data-c="'+c+'" style="cursor:pointer"><td>'+esc(cl.n)+'</td><td class="num">'+fQ(v.q)+'</td><td class="num">'+fR(v.f)+'</td><td class="num">'+(v.q?fR(v.b/v.q):"–")+'</td></tr>'; })) : '<div class="empty">Ninguém comprou este produto no período.</div>');
  modal(h + '</div>');
  $("#md").querySelectorAll("tr[data-c]").forEach(tr => tr.onclick = () => abrirCliente(+tr.dataset.c));
}
function abrirCliente(c){
  const {rows, P} = janela(); const cl = CLI.get(c) || {n:"Cliente "+c, cid:""};
  const R = rows.filter(r => r.c === c), noP = R.filter(r => r.d >= P.ini && r.d <= P.fim);
  const f = noP.reduce((s,r)=>s+r.f,0), porP = new Map();
  noP.forEach(r => { const a = porP.get(r.p)||{q:0,f:0,b:0}; a.q+=r.q; a.f+=r.f; a.b+=(r.b||0); porP.set(r.p,a); });
  const s = vendSet(); let ult = null; const vs = new Set();
  D.ult.forEach(u => { if (u.c === c && (!s || s.has(u.v))) { if (!ult || u.d > ult) ult = u.d; vs.add(grupoDe(u.v)); } });
  let h = '<div class="mh"><div><h3>'+esc(cl.n)+'</h3><div class="sub">'+esc(cl.cid||"")+(vs.size?' · '+esc([...vs].join(", ")):'')+'</div></div><div class="sp"></div><button class="iconbtn" data-x>✕</button></div><div class="mb">';
  h += '<div class="mini"><div><span>Faturamento</span><b class="num">'+fR(f)+'</b></div><div><span>Produtos</span><b class="num">'+porP.size+'</b></div><div><span>Última compra</span><b class="num">'+(ult?fD(ult):"–")+'</b></div><div><span>Dias sem compra</span><b class="num">'+(ult?diff(ult,HOJE):"–")+'</b></div></div>';
  h += '<h4>Faturamento nos últimos 21 dias</h4>' + sparkHtml(R, P.fim, r => r.f, fR);
  h += '<h4>O que comprou no período ('+fD(P.ini)+(P.ini!==P.fim?' a '+fD(P.fim):'')+')</h4>' + (porP.size ? tabelaSimples(["Produto","UN","Qtd","Faturamento","Preço médio bruto"], [...porP.entries()].sort((a,b)=>b[1].f-a[1].f).map(([id,v]) => { const p = PROD.get(id)||{n:"Produto "+id,un:""}; return '<tr><td>'+esc(p.n)+'</td><td><span class="unb">'+esc(p.un)+'</span></td><td class="num">'+fQ(v.q)+'</td><td class="num">'+fR(v.f)+'</td><td class="num">'+(v.q?fR(v.b/v.q):"–")+'</td></tr>'; })) : '<div class="empty">Sem compras no período.</div>');
  modal(h + '</div>');
}
function modal(html){ $("#md").innerHTML = html; $("#ov").classList.add("on"); $("#md").querySelector("[data-x]").onclick = fechar; }
function fechar(){ $("#ov").classList.remove("on"); }
$("#ov").addEventListener("click", e => { if (e.target.id === "ov") fechar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });

/* ---------- tooltip ---------- */
function tip(e, html){ const t = $("#tip"); t.innerHTML = html; t.style.display = "block";
  const x = Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8); t.style.left = x + "px"; t.style.top = (e.clientY - t.offsetHeight - 10) + "px"; }
function hideTip(){ $("#tip").style.display = "none"; }

/* ---------- eventos ---------- */
document.querySelectorAll("#segModo button").forEach(b => b.onclick = () => {
  const rows = itensVend(), datas = datasComVenda(rows), ult = datas.filter(d => d <= HOJE).pop() || datas[datas.length-1];
  st.modo = b.dataset.m;
  if (st.modo === "dia") st.data = ult;
  if (st.modo === "ant"){ const fo = diasFortes(rows); st.data = fo.filter(d => d < ult).pop() || ult; }
  if (st.modo === "7d" || st.modo === "mes") st.data = ult;
  if (st.modo === "per"){ st.ate = st.ate || ult; st.de = st.de || addD(ult,-13); $("#dDe").value = st.de; $("#dAte").value = st.ate; }
  render();
});
function moverDia(n){
  const datas = datasComVenda(itensVend());
  if (st.modo === "dia" || st.modo === "ant"){
    let i = datas.indexOf(st.data); if (i < 0) i = datas.filter(d => d < st.data).length - (n>0?1:0);
    const j = Math.min(datas.length-1, Math.max(0, i+n)); st.data = datas[j];
  } else if (st.modo === "7d"){ st.data = addD(st.data, 7*n); }
  else if (st.modo === "mes"){ st.data = n < 0 ? addD(firstOfMonth(st.data),-1) : (()=>{ const x = edate(firstOfMonth(st.data),1); const u = new Date(Date.UTC(+x.slice(0,4), +x.slice(5,7), 0)); return toS(u); })(); }
  const ultima = datas[datas.length-1]; if (st.data > ultima) st.data = ultima;
  render();
}
$("#prevDia").onclick = () => moverDia(-1);
$("#nextDia").onclick = () => moverDia(1);
$("#dDe").onchange = e => { st.de = e.target.value; render(); };
$("#dAte").onchange = e => { st.ate = e.target.value; render(); };
$("#busca").oninput = e => { st.busca = e.target.value; render(); };
$("#kpisVol").addEventListener("click", e => { const k = e.target.closest(".kpi.un"); if (k){ st.un = k.dataset.un; render(); } });
$("#btnTema").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("qtd_tema", nx); } catch(e){}
};
$("#btnPrint").onclick = () => print();
$("#btnCsv").onclick = () => {
  const n2 = v => (v===null||v===undefined||v==="") ? "" : String(Math.round(v*100)/100).replace(".",",");
  const lin = [["Produto","UN","Qtd","Anterior","Media","Var","Sugerida","Preco medio bruto","Faturamento"].join(";")]
    .concat(linhasTab.map(r => [r.n, r.un, n2(r.q), n2(r.ant), n2(r.med), r.var===null?"":n2(r.var*100)+"%", r.sug??"", n2(r.pm), n2(r.f)].join(";")));
  const blob = new Blob(["﻿" + lin.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "quantidade_" + (D.escopo || st.vend).replace(/[^\w]+/g,"_") + "_" + (st.data||"") + ".csv"; a.click();
};

// vendedor
if (D.escopo){ $("#flVend").style.display = "none"; }
else {
  const nomes = [...GRUPOS.keys()].filter(g => ITENS.some(r => grupoDe(r.v) === g)).sort((a,b)=>a.localeCompare(b,"pt-BR"));
  $("#selVend").innerHTML = '<option value="*">Todos</option>' + nomes.map(n => '<option>'+esc(n)+'</option>').join("");
  $("#selVend").onchange = e => { st.vend = e.target.value; st.data = null; render(); };
}
const g = D.geradoEm ? new Date(D.geradoEm) : null;
$("#stamp").textContent = g ? "Atualizado em " + fD(D.geradoEm.slice(0,10)) + " " + D.geradoEm.slice(11,16) : "";
if (D.escopo) $("#titulo").textContent = "Minhas vendas · quantidade";
render();
});
